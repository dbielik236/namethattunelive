<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Answer History · Name That Tune</title>
<link rel="stylesheet" href="styles.css">
<style>
  .answers-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .team-history{margin-top:18px}
  .team-history summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .team-history summary::-webkit-details-marker{display:none}
  .team-history summary:after{content:"＋";font-size:1.2rem}
  .team-history[open] summary:after{content:"−"}
  .history-round{margin-top:18px}
  .history-round h3{margin-bottom:10px}
  .history-song{padding:12px 0;border-top:1px solid rgba(127,127,127,.25)}
  .history-song:first-of-type{border-top:0}
  .history-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
  .history-meta span{font-size:.9rem}
  .history-status{font-weight:600}
  .history-muted{opacity:.7}
  .bonus-history{margin-top:14px;padding:12px;border:1px solid rgba(127,127,127,.25);border-radius:12px}
  .team-score-summary{font-weight:700;white-space:nowrap}
  @media print{
    #loginPanel,.answers-toolbar button,.footer{display:none!important}
    .team-history{break-inside:avoid}
    .team-history:not([open])>*:not(summary){display:block!important}
  }
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="brand">Gus & Jean · Name That Tune</div>
  <h1>Team Answer History</h1>
  <p id="statusText" class="muted">Connecting...</p>
</header>

<section id="loginPanel" class="panel" style="max-width:480px">
  <h2>Host sign in</h2>
  <label>Email</label><input id="email" type="email" placeholder="Host email">
  <label>Password</label><input id="password" type="password" placeholder="Password">
  <button id="loginBtn" class="full">Sign in</button>
  <div id="loginMsg" class="message">Sign in with the host account to view team answers.</div>
</section>

<section id="answersApp" class="hidden">
  <section class="panel">
    <div class="answers-toolbar">
      <div>
        <div class="small">GAME CODE</div>
        <div class="big-code" id="gameCode"></div>
        <h2 id="eventName">Name That Tune</h2>
      </div>
      <div class="actions">
        <button class="secondary" id="printAnswers">Print</button>
        <button class="secondary" id="backToHost">Back to host</button>
      </div>
    </div>
    <p id="loadStatus" class="muted">Loading team answers...</p>
  </section>
  <section id="teamHistories"></section>
</section>

<div class="footer">Gus & Jean · Name That Tune LIVE!</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
const loginPanel=$("loginPanel");
const answersApp=$("answersApp");
let loaded=false;

$("loginBtn").onclick=async()=>{
  $("loginBtn").disabled=true;
  try{
    await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);
  }catch(e){
    showMessage($("loginMsg"),e.message,"error");
    $("loginBtn").disabled=false;
  }
};

$("printAnswers").onclick=()=>window.print();
$("backToHost").onclick=()=>{location.href="host.html"+(gameCode?"?game="+encodeURIComponent(gameCode):"");};

auth.onAuthStateChanged(async user=>{
  if(!user)return;
  if(user.isAnonymous){
    showMessage($("loginMsg"),"Please sign in with the host account to view answer history.","error");
    return;
  }
  if(loaded)return;
  loaded=true;
  loginPanel.classList.add("hidden");
  answersApp.classList.remove("hidden");
  if(!gameCode){
    $("statusText").textContent="No game code was provided. Open this page from the host dashboard.";
    $("loadStatus").textContent="";
    return;
  }
  await loadAnswerHistory(gameCode);
});

async function loadAnswerHistory(code){
  $("gameCode").textContent=code;
  try{
    const gameSnap=await gameRef(code).get();
    if(!gameSnap.exists)throw new Error("Game not found.");
    const game=gameSnap.data();
    $("eventName").textContent=game.eventName||"Name That Tune";
    const teamSnap=await gameRef(code).collection("teams").get();
    const bonusSnap=await gameRef(code).collection("bonusAnswers").get();

    const bonusByTeamRound={};
    bonusSnap.forEach(doc=>{
      const a=doc.data();
      const k=(a.teamId||"")+"_r"+a.roundIndex;
      bonusByTeamRound[k]=a;
    });

    const allTeams=await Promise.all(teamSnap.docs.map(async teamDoc=>{
      const team={id:teamDoc.id,...teamDoc.data()};
      const answerSnap=await teamRef(code,team.id).collection("answers").get();
      const answers={};
      answerSnap.forEach(doc=>{
        const a=doc.data();
        const roundIndex=Number.isInteger(a.roundIndex)?a.roundIndex:parseInt((doc.id.match(/^r(\d+)_s/)||[])[1],10);
        const songNumber=Number.isInteger(a.songNumber)?a.songNumber:parseInt((doc.id.match(/_s(\d+)$/)||[])[1],10);
        if(Number.isInteger(roundIndex)&&Number.isInteger(songNumber)){
          answers[roundIndex+"_s"+songNumber]=a;
        }
      });
      return {team,answers};
    }));

    allTeams.sort((a,b)=>(a.team.name||"").localeCompare(b.team.name||""));
    renderHistories(game,allTeams,bonusByTeamRound);
    $("statusText").textContent="Read-only answer history";
    $("loadStatus").textContent=allTeams.length
      ? `Showing ${allTeams.length} team${allTeams.length===1?"":"s"} and all recorded rounds.`
      : "No teams have joined this game.";
  }catch(e){
    console.error("ANSWER HISTORY LOAD ERROR:",e);
    $("loadStatus").textContent="Unable to load answer history: "+e.message;
  }
}

function scoreLabel(value){
  if(value===null||value===undefined)return '<span class="history-status">Pending review</span>';
  return value===1
    ? '<span class="history-status">Correct (+1)</span>'
    : '<span class="history-status">Incorrect (0)</span>';
}

function renderHistories(game,allTeams,bonusByTeamRound){
  const container=$("teamHistories");
  if(!allTeams.length){
    container.innerHTML='<section class="panel"><p class="muted">No teams have joined this game.</p></section>';
    return;
  }

  container.innerHTML=allTeams.map(({team,answers},teamIndex)=>{
    let teamHtml="";
    (game.rounds||[]).forEach((round,roundIndex)=>{
      const songs=[];
      for(let song=1;song<=(round.songCount||0);song++){
        const a=answers[roundIndex+"_s"+song];
        if(!a){
          songs.push(`<div class="history-song">
            <strong>Song ${song}</strong>
            <div class="history-meta"><span class="history-muted">No answer submitted</span></div>
          </div>`);
          continue;
        }
        const titlePoints=a.titlePoints;
        const artistPoints=a.artistPoints;
        const bothScored=titlePoints!==null&&titlePoints!==undefined&&artistPoints!==null&&artistPoints!==undefined;
        const total=bothScored?(Number(titlePoints||0)+Number(artistPoints||0)):"Pending";
        songs.push(`<div class="history-song">
          <strong>Song ${song}</strong>
          <div class="history-meta"><span>Title: ${esc(a.title||"—")}</span></div>
          <div class="history-meta"><span>Artist: ${esc(a.artist||"—")}</span></div>
          <div class="history-meta">
            <span>Title points: ${scoreLabel(titlePoints)}</span>
            <span>Artist points: ${scoreLabel(artistPoints)}</span>
            <span class="team-score-summary">Song total: ${total}${bothScored?" point"+(total===1?"":"s"):""}</span>
          </div>
        </div>`);
      }

      const bonus=bonusByTeamRound[team.id+"_r"+roundIndex];
      const bonusHtml=bonus
        ? `<div class="bonus-history">
            <strong>Bonus Song</strong>
            <div class="history-meta"><span>Artist submitted: ${esc(bonus.artist||"—")}</span></div>
            <div class="history-meta">
              <span>Result: ${bonus.isCorrect===true?"Correct":bonus.isCorrect===false?"Incorrect":"Not reviewed"}</span>
              <span class="team-score-summary">Points: ${bonus.pointsAwarded===null||bonus.pointsAwarded===undefined?"Pending":Number(bonus.pointsAwarded||0)}</span>
            </div>
          </div>`
        : `<div class="bonus-history"><strong>Bonus Song</strong><div class="history-meta"><span class="history-muted">No bonus answer submitted</span></div></div>`;

      teamHtml+=`<div class="history-round">
        <h3>${esc(round.name||"Round "+(roundIndex+1))}</h3>
        ${songs.join("")}
        ${roundIndex<game.rounds.length-1?bonusHtml:""}
      </div>`;
    });

    return `<details class="panel team-history" ${teamIndex===0?"open":""}>
      <summary><strong>${esc(team.name||"Unnamed Team")}</strong><span class="team-score-summary">${Number(team.totalPoints||0)} total points</span></summary>
      ${teamHtml}
    </details>`;
  }).join("");
}
</script>
</body>
</html>
